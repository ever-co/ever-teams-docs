# Static server for the built Docusaurus site.
#
# This is the stock nginx:alpine default.conf plus these changes: absolute_redirect off, the
# site's own 404 page, security headers and /.well-known/security.txt (both explained in the
# server block).
#
# nginx defaults to absolute_redirect on, so when it issues the trailing-slash redirect for a
# directory it rebuilds a full URL from the Host header and its own listen port. It has no idea TLS
# was terminated upstream, so it answers with http://. Measured on docs.ever.team on 2026-09-27:
#
#     https://docs.ever.team/help  ->  301  http://docs.ever.team/help/   (nginx, downgraded)
#
# With absolute_redirect off nginx emits a relative `Location: /help/`, and the client keeps
# whatever scheme it arrived on -- one hop, no downgrade, no dependence on knowing the public scheme.
# (trailingSlash: true in docusaurus.config.ts means the site itself never links to the slash-less
# form; this only matters for old or external links.)
#
# error_page 404 serves the Docusaurus 404.html (site chrome, navigation, search) with a 404 status
# instead of nginx's bare built-in page.
# A 404 must never be cached, by the edge or the browser (header added in the server block below).
# This file is included inside nginx's http block, where map lives. Any other status gets an
# empty value, and add_header sends no header for an empty value.
map $status $no_store_on_404 {
    404     "no-store";
    default "";
}

server {
    listen       80;
    server_name  localhost;

    absolute_redirect off;

    # Security headers, the baseline of every Ever website (ever.co). `always` sends them with every
    # status, the 301s and 404s included. nginx drops ALL server-level add_header lines in a location
    # that sets an add_header of its own, so a location below that adds a header must repeat this set.
    # No HSTS here: the Cloudflare zone sends it. server_tokens off keeps the nginx version out of the
    # Server header and the error pages.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Never cache a 404. While a deploy rolls, the old pod still answers some requests and has none of
    # the new build's hashed files (/assets/js/runtime~main.<hash>.js). Its 404 had no Cache-Control,
    # so Cloudflare kept it at the edge (cf-cache-status HIT on docs.ever.team, 2026-11-21) and browsers
    # could keep it too: the page did not hydrate after a deploy until that copy expired (up to 4 h
    # on zones that add max-age=14400). Other statuses get no header from this line (empty value).
    # Like the set above, a location with an add_header of its own must repeat it.
    add_header Cache-Control $no_store_on_404 always;

    # RFC 9116 security.txt, answered by nginx itself so it does not depend on the Docusaurus build
    # copying a dot-directory out of static/. An exact-match location wins over every other one, so
    # no built file can shadow it. It sets no add_header, so it inherits the set above.
    # Renew Expires before 2027-11-19.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: mailto:security@ever.co\nExpires: 2027-11-19T00:00:00.000Z\nPreferred-Languages: en\nCanonical: https://docs.ever.team/.well-known/security.txt\nPolicy: https://github.com/ever-co/ever-teams/security/policy\n";
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   404              /404.html;
    location = /404.html {
        root   /usr/share/nginx/html;
        internal;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
